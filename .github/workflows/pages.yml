# Publishes the website (the hosted build, dist/) with GitHub Pages, from this repository only.
#
# It runs after every change merged into main, after each run of the hourly fetch, and by hand
# from the Actions tab (Actions → "Publish website" → Run workflow). It does nothing until GitHub
# Pages is switched on for this repository with the source "GitHub Actions":
#   Settings → Pages → Build and deployment → Source: GitHub Actions
# (on GitHub's free plan Pages needs the repository to be public). docs/ADMIN_GUIDE.md has the
# steps. The address is https://curateapp12.github.io/curanet/ , or the owner's own domain once it is
# set under Settings → Pages → Custom domain (nothing in this file changes for that).
#
# The site loads publishers' pictures from their own addresses and plays videos in YouTube's
# privacy-enhanced player when a visitor presses play; nothing is copied into the published files.
name: Publish website

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Hourly fetch]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the website
    # Skips quietly while Pages is off (no red cross on every merge), and after a failed fetch.
    if: >-
      (github.event_name == 'workflow_dispatch' || github.event.repository.has_pages) &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check the data files
        run: npm run validate
      - name: Build the website
        run: node scripts/build.js --target hosted --out dist
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
